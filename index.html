<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAZEDUL Generator Tech</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Firebase SDK (Version 8 - Browser Friendly) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-light p-4">

    <div class="container">
        <h2 class="fw-bold mb-4">SAZEDUL Generator Tech - Database Test</h2>

        <!-- Data Add Form -->
        <div class="card p-4 shadow-sm mb-4">
            <h4>নতুন তথ্য যোগ করুন</h4>
            <div class="mb-3">
                <input type="text" id="postTitle" class="form-control" placeholder="শিরোনাম (Title)">
            </div>
            <div class="mb-3">
                <textarea id="postDesc" class="form-control" rows="3" placeholder="বিস্তারিত বিবরণ..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="saveData()">ডেটাবেসে সেভ করুন</button>
        </div>

        <!-- Saved Data List -->
        <h4 class="fw-bold">সেভ করা তথ্যসমূহ:</h4>
        <div id="dataList"></div>
    </div>

    <script>
      // ১. আপনার Firebase কনফিগারেশন সেটআপ
      const firebaseConfig = {
        apiKey: "AIzaSyCXT0Aoc3BDrfufS5y2b4aedls2pqYx5fg",
        authDomain: "sazedul-generator-tech.firebaseapp.com",
        databaseURL: "https://sazedul-generator-tech-default-rtdb.firebaseio.com",
        projectId: "sazedul-generator-tech",
        storageBucket: "sazedul-generator-tech.firebasestorage.app",
        messagingSenderId: "1054473529796",
        appId: "1:1054473529796:web:ef7172ff56d293d5dd9c91",
        measurementId: "G-WV46K5KD8S"
      };

      // ২. Firebase ইনিশিয়ালাইজেশন
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      // ৩. ডেটাবেসে তথ্য সেভ করার ফাংশন
      function saveData() {
        const title = document.getElementById('postTitle').value;
        const desc = document.getElementById('postDesc').value;

        if(!title || !desc) {
            alert('সবগুলো ঘর পূরণ করুন');
            return;
        }

        // Realtime Database-এ নতুন পোস্ট যোগ করা
        database.ref('posts').push({
            title: title,
            desc: desc,
            timestamp: Date.now()
        }).then(() => {
            alert('সফলভাবে সেভ হয়েছে!');
            document.getElementById('postTitle').value = '';
            document.getElementById('postDesc').value = '';
        }).catch((error) => {
            alert('ভুল হয়েছে: ' + error.message);
        });
      }

      // ৪. ডেটাবেস থেকে তথ্য এনে স্ক্রিনে দেখানো
      database.ref('posts').on('value', (snapshot) => {
        const dataList = document.getElementById('dataList');
        dataList.innerHTML = '';
        
        snapshot.forEach((childSnapshot) => {
            const item = childSnapshot.val();
            dataList.innerHTML += `
                <div class="card p-3 my-2 border">
                    <h5>${item.title}</h5>
                    <p>${item.desc}</p>
                </div>
            `;
        });
      });
    </script>
</body>
</html>
